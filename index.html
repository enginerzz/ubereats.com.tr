<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felsefe ve Zihin - Giriş</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            background-color: #111827;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #1f2937;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #f3f4f6;
        }
        .subtitle {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 30px;
            font-style: italic;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #d1d5db;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #6366f1;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
            font-family: sans-serif;
            font-weight: bold;
        }
        button:hover {
            background-color: #4338ca;
        }
        .quote {
            margin-top: 25px;
            font-size: 12px;
            color: #6b7280;
            line-height: 1.5;
            border-top: 1px solid #1f2937;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cogito Ergo Sum</h1>
        <div class="subtitle">"Düşünüyorum, öyleyse varım."</div>
        
        <form onsubmit="event.preventDefault(); alert('Mağaradan çıkış simülasyonu başlatıldı.');">
            <div class="input-group">
                <label>Zihin / E-posta Adresi</label>
                <input type="text" placeholder="bilinc@felsefe.com" required>
            </div>
            
            <div class="input-group">
                <label>Mutlak Hakikat / Şifre</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit">Mağaradan Çık (Giriş Yap)</button>
        </form>

        <div class="quote">
            "Sorgulanmamış bir yaşam, yaşanmaya değer değildir." — Socrates
        </div>
    </div>

</body>
</html>
