<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felsefe ve Zihin - Giriş</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', serif; }
        body { background-color: #0b0f19; color: #e2e8f0; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { background-color: #111827; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px; border: 1px solid #1f2937; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 10px; color: #f3f4f6; }
        .subtitle { font-size: 13px; color: #9ca3af; margin-bottom: 30px; font-style: italic; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #d1d5db; }
        input { width: 100%; padding: 12px; background-color: #1f2937; border: 1px solid #374151; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
        button { width: 100%; padding: 12px; background-color: #4f46e5; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-register { background-color: #10b981; }
        .quote { margin-top: 25px; font-size: 12px; color: #6b7280; line-height: 1.5; border-top: 1px solid #1f2937; padding-top: 15px; }
        #message { margin-top: 15px; font-size: 13px; padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cogito Ergo Sum</h1>
        <div class="subtitle">"Düşünüyorum, öyleyse varım."</div>
        
        <div class="input-group">
            <label>Zihin / E-posta Adresi</label>
            <input type="email" id="email" placeholder="bilinc@felsefe.com">
        </div>
        
        <div class="input-group">
            <label>Mutlak Hakikat / Şifre</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <button id="loginBtn">Mağaradan Çık (Giriş Yap)</button>
        <button id="registerBtn" class="btn-register">Zihni Kayıt Et (Üye Ol)</button>

        <div id="message"></div>

        <div class="quote">
            "Sorgulanmamış bir yaşam, yaşanmaya değer değildir." — Socrates
        </div>
    </div>

    <script>
        // DIKKAT: Yalnizca BURADAKI buyuk harfli metinleri sil, tırnak işaretlerine (`'`) ASLA dokunma!
        const SUPABASE_URL = 'https://supabase.com/dashboard/project/vskricxnmyupilqwsqyt';
        const SUPABASE_ANON_KEY = 'sb_publishable_HHpLGNX8JobjJFS4w8uvmw_JeZg6b4_';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const messageDiv = document.getElementById('message');

        function showMessage(text, isError = false) {
            messageDiv.innerText = text;
            messageDiv.style.backgroundColor = isError ? '#7f1d1d' : '#065f46';
            messageDiv.style.color = '#fff';
        }

        registerBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if(!email || !password) {
                showMessage('Lütfen e-posta ve şifre yazın!', true);
                return;
            }

            showMessage('Kayıt yapılıyor...');
            const { data, error } = await _supabase.auth.signUp({ email, password });

            if (error) {
                showMessage('Hata: ' + error.message, true);
            } else {
                showMessage('Kayıt başarılı! Şimdi giriş yapabilirsiniz.');
            }
        });

        loginBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if(!email || !password) {
                showMessage('Lütfen e-posta ve şifre yazın!', true);
                return;
            }

            showMessage('Giriş yapılıyor...');
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                showMessage('Giriş Hatası: ' + error.message, true);
            } else {
                showMessage('Başarıyla giriş yapıldı! Hoş geldiniz.');
            }
        });
    </script>

</body>
</html>
